 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Athletic Wear</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
border-bottom:2px solid #222;
position:sticky;
top:0;
z-index:100;
}

header h1{
margin:0;
font-size:40px;
letter-spacing:3px;
}

.hero{
text-align:center;
padding:80px 20px;
background:linear-gradient(to bottom,#111,#1a1a1a);
}

.hero h2{
font-size:55px;
margin-bottom:10px;
}

.hero p{
color:#bbb;
font-size:20px;
max-width:700px;
margin:auto;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
padding:50px;
}

.product{
background:#1c1c1c;
border-radius:14px;
overflow:hidden;
text-align:center;
padding-bottom:25px;
transition:0.3s;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.product:hover{
transform:translateY(-5px);
}

.product img{
width:100%;
height:420px;
object-fit:cover;
}

.product h3{
margin:18px 0 10px;
font-size:28px;
}

.price{
font-size:24px;
margin-bottom:18px;
font-weight:bold;
}

select{
padding:12px;
width:80%;
margin-bottom:18px;
border:none;
border-radius:8px;
font-size:16px;
background:#f1f1f1;
}

button{
background:white;
color:black;
border:none;
padding:14px 28px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.2s;
}

button:hover{
background:#ddd;
transform:scale(1.03);
}

footer{
text-align:center;
padding:35px;
color:#777;
font-size:15px;
border-top:1px solid #222;
margin-top:20px;
}

</style>
</head>

<body>

<header>
<h1>PEAK ATHLETIC</h1>
</header>

<section class="hero">
<h2>Train At Your Peak</h2>
<p>
Premium athletic wear built for performance, comfort, and confidence.
</p>
</section>

<section class="products">

<!-- WHITE TEE -->

<div class="product">

<img src="0FFBD9A2-A680-408D-96EB-A99F97F32FAD.jpeg" alt="White Compression Tee">

<h3>White Compression Tee</h3>

<div class="price">$35</div>

<select id="whiteSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyProduct('White Compression Tee', 'whiteSize')">
Buy Now
</button>

</div>

<!-- BLACK TEE -->

<div class="product">

<img src="73B81421-ACCE-4EFE-89FD-92783946B980.jpeg" alt="Black Compression Tee">

<h3>Black Compression Tee</h3>

<div class="price">$35</div>

<select id="blackSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyProduct('Black Compression Tee', 'blackSize')">
Buy Now
</button>

</div>

<!-- NAVY TEE -->

<div class="product">

<img src="27583F2A-AA0D-4282-B16E-1FBCC385C948.jpeg" alt="Navy Compression Tee">

<h3>Navy Compression Tee</h3>

<div class="price">$40</div>

<select id="navySize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyProduct('Navy Compression Tee', 'navySize')">
Buy Now
</button>

</div>

<!-- MAROON TEE -->

<div class="product">

<img src="DCB4BD84-E9AF-4D2A-B175-5BB5FB0664EA.jpeg" alt="Maroon Performance Tee">

<h3>Maroon Performance Tee</h3>

<div class="price">$40</div>

<select id="maroonSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyProduct('Maroon Performance Tee', 'maroonSize')">
Buy Now
</button>

</div>

</section>

<footer>
© 2026 Peak Athletic Wear
</footer>

<script>

function buyProduct(productName, sizeId){

const size = document.getElementById(sizeId).value;

if(size === ""){
alert("Please select a size first.");
return;
}

window.location.href = "https://cash.app/$joshuahdu";

}

</script>

</body>
</html>
