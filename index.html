<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PEAK ATHLETIC</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
border-bottom:2px solid #222;
}

header h1{
font-size:42px;
letter-spacing:4px;
}

header p{
color:#aaa;
margin-top:10px;
}

.hero{
background:url('banner.jpg') center/cover no-repeat;
height:60vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h2{
font-size:60px;
background:rgba(0,0,0,0.6);
padding:20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
padding:40px;
}

.product{
background:#1b1b1b;
border-radius:12px;
overflow:hidden;
transition:0.3s;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.product:hover{
transform:translateY(-5px);
}

.product img{
width:100%;
height:400px;
object-fit:cover;
}

.product-info{
padding:20px;
}

.product-info h3{
margin-bottom:10px;
font-size:24px;
}

.price{
color:#4da3ff;
font-size:22px;
margin-bottom:15px;
}

select{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#0d6efd;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0953c7;
}

.cart{
position:fixed;
top:20px;
right:20px;
background:#0d6efd;
padding:12px 18px;
border-radius:10px;
font-weight:bold;
z-index:1000;
}

footer{
text-align:center;
padding:30px;
color:#777;
border-top:1px solid #222;
margin-top:30px;
}

.checkout{
text-align:center;
margin:40px;
}

.checkout a{
background:#00c853;
padding:15px 25px;
color:white;
text-decoration:none;
border-radius:10px;
font-size:20px;
display:inline-block;
}

.checkout a:hover{
background:#00a844;
}
</style>
</head>

<body>

<div class="cart">
Cart: <span id="cart-count">0</span>
</div>

<header>
<h1>PEAK ATHLETIC</h1>
<p>Performance Wear For Athletes</p>
</header>

<section class="hero">
<h2>TRAIN HARD. LOOK CLEAN.</h2>
</section>

<section class="products">

<!-- WHITE SHIRT -->
<div class="product">
<img src="white-shirt.jpg" alt="White Compression Shirt">

<div class="product-info">
<h3>White Compression Tee</h3>
<p class="price">$39.99</p>

<select>
<option>Extra Small</option>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button onclick="addToCart()">
Add To Cart
</button>
</div>
</div>

<!-- BLACK SHIRT -->
<div class="product">
<img src="black-shirt.jpg" alt="Black Compression Shirt">

<div class="product-info">
<h3>Black Compression Tee</h3>
<p class="price">$39.99</p>

<select>
<option>Extra Small</option>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button onclick="addToCart()">
Add To Cart
</button>
</div>
</div>

<!-- NAVY BLUE SHIRT -->
<div class="product">
<img src="navy-shirt.jpg" alt="Navy Compression Shirt">

<div class="product-info">
<h3>Navy Compression Tee</h3>
<p class="price">$39.99</p>

<select>
<option>Extra Small</option>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button onclick="addToCart()">
Add To Cart
</button>
</div>
</div>

</section>

<div class="checkout">
<a href="https://cash.app/$YOURCASHTAG">
Checkout With Cash App
</a>
</div>

<footer>
© 2026 PEAK ATHLETIC
</footer>

<script>
let cart = 0;

function addToCart(){
cart++;
document.getElementById("cart-count").innerText = cart;
alert("Added To Cart!");
}
</script>

</body>
</html>
