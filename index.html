 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEAK ATHLETIC</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

header{
background:black;
padding:25px;
text-align:center;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:42px;
letter-spacing:4px;
}

header p{
color:#888;
margin-top:8px;
}

.hero{
height:70vh;
background:url('A1B25FF3-BDC4-4777-A0DD-E691AF39B106.png') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero-overlay{
background:rgba(0,0,0,0.65);
padding:40px;
border-radius:12px;
}

.hero h2{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
color:#ddd;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
padding:60px 40px;
}

.product{
background:#181818;
border-radius:15px;
overflow:hidden;
transition:0.3s;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.product:hover{
transform:translateY(-8px);
}

.product img{
width:100%;
height:420px;
object-fit:cover;
}

.product-info{
padding:25px;
text-align:center;
}

.product h3{
font-size:28px;
margin-bottom:10px;
}

.price{
font-size:24px;
color:#4da3ff;
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2b2b2b;
color:white;
margin-bottom:20px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:white;
color:black;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#dcdcdc;
}

footer{
text-align:center;
padding:40px;
color:#777;
border-top:1px solid #222;
}

</style>
</head>

<body>

<header>
<h1>PEAK ATHLETIC</h1>
<p>Performance Wear Built For Athletes</p>
</header>

<section class="hero">
<div class="hero-overlay">
<h2>TRAIN AT YOUR PEAK</h2>
<p>Premium Compression Wear For Sports & Training</p>
</div>
</section>

<section class="products">

<!-- WHITE SHIRT -->

<div class="product">

<img src="A1B25FF3-BDC4-4777-A0DD-E691AF39B106.png">

<div class="product-info">

<h3>White Compression Tee</h3>

<div class="price">$35</div>

<select>
<option>Select Size</option>
<option>Extra Small</option>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button onclick="window.location.href='https://cash.app/$joshuahdu'">
Buy Now
</button>

</div>
</div>

<!-- BLACK SHIRT -->

<div class="product">

<option>Medium</option>

</select>

Buy Now
</button>

</div>
</div>

<!-- NAVY SHIRT -->

<div class="product">

<img src="navy-shirt.png">

<div class="product-info">

<h3>Navy Compression Tee</h3>

<div class="price">$35</div>

<select>
<option>Select Size</option>
<option>Extra Small</option>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button onclick="window.location.href='https://cash.app/$joshuahdu'">
Buy Now
</button>

</div>
</div>

</section>

<footer>
© 2026 PEAK ATHLETIC
</footer>

</body>
</html>
