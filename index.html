<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Athletic Wear</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
border-bottom:2px solid #222;
}

header h1{
margin:0;
font-size:40px;
letter-spacing:2px;
}

.hero{
text-align:center;
padding:60px 20px;
background:#1a1a1a;
}

.hero h2{
font-size:50px;
margin-bottom:10px;
}

.hero p{
color:#bbb;
font-size:18px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
padding:40px;
}

.product{
background:#1c1c1c;
border-radius:12px;
overflow:hidden;
text-align:center;
padding-bottom:20px;
transition:0.3s;
}

.product:hover{
transform:scale(1.02);
}

.product img{
width:100%;
height:400px;
object-fit:cover;
}

.product h3{
margin:15px 0 10px;
}

.price{
font-size:22px;
margin-bottom:15px;
}

select{
padding:10px;
width:80%;
margin-bottom:15px;
border:none;
border-radius:6px;
}

button{
background:white;
color:black;
border:none;
padding:12px 25px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ddd;
}

footer{
text-align:center;
padding:30px;
color:#777;
}

</style>
</head>

<body>

<header>
<h1>PEAK ATHLETIC</h1>
</header>

<section class="hero">
<h2>Train At Your Peak</h2>
<p>Premium athletic wear built for performance and comfort.</p>
</section>

<section class="products">

<!-- WHITE SHIRT -->

<div class="product">

<img src="0FFBD9A2-A680-408D-96EB-A99F97F32FAD.jpeg" alt="White Compression Tee">

<h3>White Compression Tee</h3>

<div class="price">$35</div>

<select id="whiteSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyNow('whiteSize')">
Buy Now
</button>

</div>

<!-- BLACK SHIRT -->

<div class="product">

<img src="73B81421-ACCE-4EFE-89FD-92783946B980.jpeg" alt="Black Compression Tee">

<h3>Black Compression Tee</h3>

<div class="price">$35</div>

<select id="blackSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyNow('blackSize')">
Buy Now
</button>

</div>

<!-- MAROON SHIRT -->

<div class="product">

<img src="DCB4BD84-E9AF-4D2A-B175-5BB5FB0664EA.jpeg" alt="Maroon Performance Tee">

<h3>Maroon Performance Tee</h3>

<div class="price">$40</div>

<select id="maroonSize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyNow('maroonSize')">
Buy Now
</button>

</div>

<!-- NAVY SHIRT -->

<div class="product">

<img src="27583F2A-AA0D-4282-B16E-1FBCC385C948.jpeg" alt="Navy Compression Tee">

<h3>Navy Compression Tee</h3>

<div class="price">$40</div>

<select id="navySize">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<br>

<button onclick="buyNow('navySize')">
Buy Now
</button>

</div>

</section>

<footer>
© 2026 Peak Athletic Wear
</footer>

<script>

function buyNow(sizeId){

const size = document.getElementById(sizeId).value;

if(size === ""){
alert("Please select a size first.");
return;
}

window.location.href='https://cash.app/$joshuahdu';

}

</script>

</body>
</html>
